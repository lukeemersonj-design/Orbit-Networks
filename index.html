<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit — Your Private Space</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="stylesheet" href="/orbit.css" />
    <script src="/orbit-prefs.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg, #000);
        color: var(--text-main, #fff);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding-bottom: 60px;
        overflow-x: hidden;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      .bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: var(--text-main, #fff);
        opacity: 0.6;
        animation: twinkle 3s infinite ease-in-out;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }

      .hero {
        text-align: center;
        margin-top: 40px;
        margin-bottom: 30px;
        z-index: 2;
      }

      .logo-main {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        animation: float 6s ease-in-out infinite;
        filter: drop-shadow(
          0 0 20px var(--accent-glow, rgba(252, 38, 81, 0.3))
        );
        transition: filter 0.3s ease;
      }

      .logo-main img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-15px) rotate(4deg);
        }
      }

      h1 {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        background: linear-gradient(
          135deg,
          var(--text-main, #fff),
          var(--accent, #fc2651)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(
          0 0 30px var(--accent-glow, rgba(252, 38, 81, 0.4))
        );
        transition: filter 0.3s ease;
      }

      .tagline {
        font-size: 0.85rem;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--text-muted, rgba(255, 255, 255, 0.4));
        margin-top: 8px;
      }

      .search-container {
        width: 100%;
        max-width: 600px;
        margin-bottom: 40px;
        z-index: 2;
      }

      .proxy-form {
        display: flex;
        align-items: center;
        background: var(--panel-bg, rgba(255, 255, 255, 0.05));
        border: 1px solid var(--border, rgba(255, 255, 255, 0.15));
        border-radius: 30px;
        padding: 8px;
        backdrop-filter: blur(25px);
        transition: all 0.3s ease;
      }

      .proxy-form:focus-within {
        border-color: var(--accent, #fc2651);
        box-shadow: 0 0 30px var(--accent-glow, rgba(252, 38, 81, 0.3));
        transform: scale(1.02);
      }

      .proxy-form select {
        background: none;
        border: none;
        color: var(--text-muted, rgba(255, 255, 255, 0.6));
        padding: 0 15px;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        border-right: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      }

      .proxy-form input {
        flex: 1;
        background: none;
        border: none;
        color: var(--text-main, #fff);
        padding: 0 15px;
        font-size: 1rem;
        outline: none;
      }

      .proxy-form input::placeholder {
        color: var(--text-muted, rgba(255, 255, 255, 0.4));
      }

      .proxy-form button {
        background: var(--accent, #fc2651);
        border: none;
        padding: 0 20px;
        height: 40px;
        border-radius: 25px;
        font-weight: 800;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        color: var(--button-text, #fff);
      }

      .proxy-form button:hover {
        transform: scale(1.05);
        background: var(--accent-light, #ff5e7e);
        box-shadow: 0 0 15px var(--accent-glow, rgba(252, 38, 81, 0.5));
      }

      .proxy-form button:active {
        transform: scale(0.98);
      }

      .custom-select {
        position: relative;
        min-width: 120px;
        display: flex;
        align-items: center;
      }

      .select-display {
        padding: 0 15px;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted, rgba(255, 255, 255, 0.6));
        cursor: pointer;
        border-right: 1px solid var(--border, rgba(255, 255, 255, 0.1));
        height: 38px;
        display: flex;
        align-items: center;
        user-select: none;
        transition: color 0.3s ease;
      }

      .select-display:hover {
        color: var(--text-main, #fff);
      }
      .select-display::after {
        content: "▾";
        margin-left: 6px;
        font-size: 0.65rem;
        opacity: 0.6;
      }

      .select-options {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 0;
        background: var(--bg-elevated, #0d0d0d);
        border: 1px solid var(--border, rgba(255, 255, 255, 0.15));
        border-radius: 10px;
        overflow: hidden;
        display: none;
        z-index: 999;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      }

      .select-options.open {
        display: block;
      }

      .option {
        padding: 10px 15px;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted, rgba(255, 255, 255, 0.6));
        cursor: pointer;
        transition: all 0.2s;
      }

      .option:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-main, #fff);
      }
      .option.active {
        background: rgba(255, 255, 255, 0.08);
        color: var(--accent, #fff);
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 2.2rem;
        }
        .logo-main {
          width: 100px;
          height: 100px;
        }
        .proxy-form {
          flex-direction: column;
          border-radius: 20px;
        }
        .proxy-form select {
          border-right: none;
          border-bottom: 1px solid var(--border, rgba(255, 255, 255, 0.1));
          padding: 12px;
        }
        .proxy-form input {
          padding: 12px;
          font-size: 0.85rem;
        }
        .proxy-form button {
          margin-top: 8px;
          width: calc(100% - 16px);
          margin-left: 8px;
          margin-right: 8px;
          padding: 10px 0;
          font-size: 0.75rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg" id="stars"></div>

    <div class="hero">
      <div class="logo-main">
        <img src="/logo.png" alt="Orbit Logo" />
      </div>
      <h1>Orbit</h1>
      <p class="tagline">Explore • Play • Unbound</p>
    </div>

    <div class="search-container">
      <form class="proxy-form" id="proxyForm" autocomplete="off">
        <div class="custom-select" id="customSelect">
          <div class="select-display" id="selectDisplay">Scramjet</div>

          <div class="select-options" id="selectOptions">
            <div data-value="scramjet" class="option active">Scramjet</div>
            <div data-value="ultraviolet" class="option">Ultraviolet</div>
            <div data-value="wisp" class="option">Wisp</div>
            <div data-value="whisper" class="option">Whisper</div>
          </div>
        </div>

        <input
          type="text"
          id="urlInput"
          placeholder="Search or enter URL..."
          autocomplete="off"
        />

        <button type="submit">Launch</button>
      </form>
    </div>
    <div class="discord-invite">
      <a
        href="https://discord.gg/WjH8qftWR9"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join Our Discord
      </a>
    </div>

    <style>
      .discord-invite {
        margin: 40px 0;
        z-index: 2;
        text-align: center;
      }

      .discord-invite a {
        display: inline-block;
        background: var(--accent, #fc2651);
        color: var(--button-text, #fff);
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 1rem;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        transition: all 0.25s ease;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }

      .discord-invite a:hover {
        background: var(--accent-light, #ff5e7e);
        box-shadow: 0 0 20px var(--accent-glow, rgba(252, 38, 81, 0.5));
        transform: scale(1.05);
      }

      .discord-invite a:active {
        transform: scale(0.98);
      }
    </style>
    <div id="taskbar"></div>
    <script src="/orbit-global.js"></script>

    <script>
      // Generate stars
      const starContainer = document.getElementById("stars");
      for (let i = 0; i < 120; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = Math.random() * 3 + "s";
        starContainer.appendChild(s);
      }

      // Proxy driver handling
      let selectedDriver = "scramjet";

      const select = document.getElementById("customSelect");
      const display = document.getElementById("selectDisplay");
      const options = document.getElementById("selectOptions");

      if (display && options) {
        display.addEventListener("click", (e) => {
          e.stopPropagation();
          options.classList.toggle("open");
        });

        options.querySelectorAll(".option").forEach((opt) => {
          opt.addEventListener("click", () => {
            options
              .querySelectorAll(".option")
              .forEach((o) => o.classList.remove("active"));
            opt.classList.add("active");

            selectedDriver = opt.dataset.value;
            display.textContent = opt.textContent;

            options.classList.remove("open");
          });
        });

        document.addEventListener("click", () => {
          options.classList.remove("open");
        });
      }

      function encodeBase64URL(str) {
        return btoa(unescape(encodeURIComponent(str)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      function looksUrl(s) {
        return (
          /^https?:\/\//i.test(s) ||
          (/^[a-z0-9-]+(\.[a-z]{2,})+/i.test(s) && !s.includes(" "))
        );
      }

      const proxyForm = document.getElementById("proxyForm");
      if (proxyForm) {
        proxyForm.addEventListener("submit", function (e) {
          e.preventDefault();

          const v = document.getElementById("urlInput").value.trim();
          if (!v) return;

          const u = looksUrl(v)
            ? v.startsWith("http")
              ? v
              : "https://" + v
            : "https://duckduckgo.com/?q=" + encodeURIComponent(v);

          if (selectedDriver === "scramjet") {
            window.location.href = "/scramjet/" + encodeBase64URL(u);
          } else {
            window.location.href =
              "/proxy?url=" +
              encodeURIComponent(u) +
              "&driver=" +
              selectedDriver;
          }
        });
      }

      // Calculate luminance to determine if text should be black or white
      function getLuminance(hex) {
        // Convert hex to RGB
        let r, g, b;
        if (hex.startsWith("#")) {
          if (hex.length === 4) {
            r = parseInt(hex[1] + hex[1], 16);
            g = parseInt(hex[2] + hex[2], 16);
            b = parseInt(hex[3] + hex[3], 16);
          } else {
            r = parseInt(hex.slice(1, 3), 16);
            g = parseInt(hex.slice(3, 5), 16);
            b = parseInt(hex.slice(5, 7), 16);
          }
        } else {
          // Handle rgb/rgba format
          const rgbMatch = hex.match(/\d+/g);
          if (rgbMatch) {
            r = parseInt(rgbMatch[0]);
            g = parseInt(rgbMatch[1]);
            b = parseInt(rgbMatch[2]);
          } else {
            return 0.5; // Default to mid
          }
        }

        // Calculate relative luminance (WCAG formula)
        const rsrgb = r / 255;
        const gsrgb = g / 255;
        const bsrgb = b / 255;

        const rLinear =
          rsrgb <= 0.03928
            ? rsrgb / 12.92
            : Math.pow((rsrgb + 0.055) / 1.055, 2.4);
        const gLinear =
          gsrgb <= 0.03928
            ? gsrgb / 12.92
            : Math.pow((gsrgb + 0.055) / 1.055, 2.4);
        const bLinear =
          bsrgb <= 0.03928
            ? bsrgb / 12.92
            : Math.pow((bsrgb + 0.055) / 1.055, 2.4);

        return 0.2126 * rLinear + 0.7152 * gLinear + 0.0722 * bLinear;
      }

      function getContrastColor(hex) {
        const luminance = getLuminance(hex);
        // Use black text for light backgrounds (luminance > 0.5), white text for dark backgrounds
        return luminance > 0.5 ? "#000000" : "#ffffff";
      }

      function hexToRgb(hex) {
        // Handle shorthand hex (e.g., "#fff")
        if (hex && hex.length === 4) {
          hex = "#" + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
        }
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result
          ? {
              r: parseInt(result[1], 16),
              g: parseInt(result[2], 16),
              b: parseInt(result[3], 16),
            }
          : null;
      }

      // Dynamic theming - update CSS variables based on active theme
      function updateThemeColors() {
        const prefs = window.OrbitPrefs;
        if (!prefs) return;

        const activeTheme = prefs.getActiveTheme();
        const themePreset = prefs.THEME_PRESETS[activeTheme];

        if (themePreset && themePreset.vars) {
          let accent = themePreset.vars["--accent"] || "#fc2651";

          // Parse accent color
          const accentRgb = hexToRgb(accent);

          // Create glow variant with opacity
          const accentGlow = accentRgb
            ? `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.4)`
            : "rgba(252, 38, 81, 0.4)";

          // Create lighter variant for hover (add 40 to each channel, max 255)
          let lightAccent = accent;
          if (accentRgb) {
            const r = Math.min(255, accentRgb.r + 40);
            const g = Math.min(255, accentRgb.g + 40);
            const b = Math.min(255, accentRgb.b + 40);
            lightAccent = `rgb(${r}, ${g}, ${b})`;
          }

          // Calculate contrasting text color (black for light backgrounds, white for dark)
          const buttonTextColor = getContrastColor(accent);

          // Apply all theme variables
          document.documentElement.style.setProperty("--accent", accent);
          document.documentElement.style.setProperty(
            "--accent-glow",
            accentGlow,
          );
          document.documentElement.style.setProperty(
            "--accent-light",
            lightAccent,
          );
          document.documentElement.style.setProperty(
            "--button-text",
            buttonTextColor,
          );

          // Apply to button directly
          const launchBtn = document.querySelector(".proxy-form button");
          if (launchBtn) {
            launchBtn.style.setProperty("color", buttonTextColor, "important");
            launchBtn.style.setProperty("background", accent, "important");
          }
        }
      }

      // Watch for theme changes
      if (window.OrbitPrefs) {
        // Initial update
        setTimeout(updateThemeColors, 100);

        // Override saveTheme to update colors
        const originalSaveTheme = window.OrbitPrefs.saveTheme;
        if (originalSaveTheme) {
          window.OrbitPrefs.saveTheme = function (key) {
            const result = originalSaveTheme.call(this, key);
            updateThemeColors();
            return result;
          };
        }

        // Also watch for storage events (changes from other tabs)
        window.addEventListener("storage", (e) => {
          if (e.key === window.OrbitPrefs.STORAGE_KEYS?.theme) {
            updateThemeColors();
          }
        });

        // Watch for theme changes via mutation observer
        const themeObserver = new MutationObserver(() => {
          updateThemeColors();
        });
        themeObserver.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["style"],
        });
      }

      // Ensure button visibility on load
      window.addEventListener("load", () => {
        updateThemeColors();
      });
    </script>
  </body>
</html>
